name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROBOFLOW_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency and Django baseline
        run: |
          python -m pip check
          python -c "import django; assert django.get_version() == '5.2.18', django.get_version()"
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run API regression tests
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build -- --configLoader native

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      YOLO_AUTOINSTALL: "false"
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Check pipeline dependencies
        run: python -m pip check
      - name: Run pipeline tests without model or dataset downloads
        run: python -m unittest discover -s tests -v
